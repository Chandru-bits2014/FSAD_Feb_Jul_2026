<html>
<script language="javascript">
function fun()
{
var str="internet networks";
document.write("slice of internet networks at 3,-5  :");
document.write(str.slice(3,-5));
document.write('<br>');
document.write("substr of internet networks at 3,5  :");
document.write(str.substr(3,5));
document.write('<br>');
document.write("substring of internet networks at 3,5  :");
document.write(str.substring(3,5));
}

</script>
<body>
<input type="button" value="slice" onClick="fun()" />

</body>

</html>
